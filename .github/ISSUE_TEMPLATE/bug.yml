name: Bug
description: An error, a crash, or behaviour that the documentation does not describe
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Synthetic data only.** Do not paste real personal data or a real secret: this page
        is public. A security problem is reported privately, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to see it
      description: The shortest code that shows it, with made-up values.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: airlock-pii and its extras, Python, the operating system.
      placeholder: "airlock-pii 0.1.0 [ner-ru], Python 3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: checkboxes
    id: synthetic
    attributes:
      label: Synthetic data
      options:
        - label: Nothing in this issue is real personal data or a real secret.
          required: true
