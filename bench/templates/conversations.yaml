# Conversations for the leak test: a member of staff talks with an assistant about a client.
#
# Each script becomes one request in the OpenAI messages format. The history is what a chat
# sends on its second or third turn: the assistant's earlier answers are in it, and they hold
# the values in clear that a masking proxy restored for the user.
#
# - {IIN#1} with a number is one value wherever it stands in the conversation. Every script has
#   an assistant turn that repeats a value from an earlier turn.
# - {IIN#1:typo} is an IIN with one digit wrong and {IIN#1:undated} a valid one without a birth
#   date; {BIN#1:typo} and {KZ_IBAN#1:typo} are mistyped the same way. The word in front of such
#   a value ("ИИН", "ЖСН", "IBAN") is all that says what it is. The user writes it with that
#   word; the assistant then repeats it without, and so does the user later.
# - A PERSON is half of the time a name a detector is bound to find, and of any form otherwise.
#   No name stands after a word for a company or a street, where it would not be a person.
# - A conversation ends with the user's message. A system message may open it.
# - Scripts with a {SECRET} are the ones such a proxy has to block.
#
# The slots are those of ru.yaml. Like the templates, the scripts are original writing.

conversations:
  ru:
    - domain: loan
      messages:
        - user: >-
            Помоги составить письмо клиенту. Заёмщик — {PERSON#1}, ИИН {IIN#1}, телефон
            {PHONE#1}. Кредит одобрен на {amount#1} тенге, нужно пригласить в отделение
            для подписания договора.
        - assistant: >-
            Вот черновик. «Уважаемый клиент! Сообщаем, что ваша заявка одобрена на сумму
            {amount#1} тенге. Приглашаем вас в отделение для подписания договора.»
            Для внутренней карточки: {PERSON#1}, {IIN#1}, контактный номер {PHONE#1}.
            Добавить срок действия решения?
        - user: >-
            Да, добавь, что решение действует 30 дней, и поставь в конце номер {PHONE#1}
            для связи.

    - domain: transfer
      messages:
        - system: >-
            Ты ассистент операционного отдела банка. Отвечай кратко и по делу.
        - user: >-
            Клиент {PERSON#1} просит отозвать перевод на счёт {KZ_IBAN#1}: ошибся получателем.
            Сумма {amount#1} тенге. Что нужно от клиента?
        - assistant: >-
            Нужно заявление на отзыв платежа с подписью клиента и реквизитами перевода:
            счёт получателя {KZ_IBAN#1}, сумма {amount#1} тенге, дата операции. Если деньги
            уже зачислены, возврат возможен только с согласия получателя.
        - user: >-
            Заявление есть. Подготовь текст запроса в банк получателя по счёту {KZ_IBAN#1}
            и укажи, что ответ ждём на {EMAIL#1}.

    - domain: call_centre
      messages:
        - user: >-
            Клиент продиктовал ИИН {IIN#1:typo}, но система его не принимает. Фамилия и имя:
            {PERSON#1}. В чём может быть причина?
        - assistant: >-
            Скорее всего, в номере {IIN#1:typo} ошибка: у него не сходится контрольный разряд.
            Попросите {PERSON#1:acc} продиктовать номер ещё раз или сверьте его
            с удостоверением личности.
        - user: >-
            Перепроверил по удостоверению: правильный номер {IIN#2}. А {IIN#1:typo} клиент
            назвал по памяти. Обнови, пожалуйста, текст заметки в карточке.

    - domain: contract
      messages:
        - user: >-
            Проверь, пожалуйста, текст запроса в налоговый орган. «Просим подтвердить
            регистрацию нерезидента, ИИН {IIN#1:undated}, договор {doc_no#1}.»
        - assistant: >-
            Текст корректный, но стоит добавить дату договора и полное наименование вашей
            организации. И уточните номер {IIN#1:undated}: в нём нет даты рождения, такие
            номера встречаются реже. Если он переписан из документа без ошибок, всё в порядке.
        - user: >-
            Номер верный, {IIN#1:undated} — так в свидетельстве. Добавь в запрос наш
            БИН {BIN#1} и контактный телефон {PHONE#1}.

    - domain: transfer
      messages:
        - user: >-
            Бухгалтерия прислала реквизиты поставщика: ИИК {KZ_IBAN#1:typo}, БИН {BIN#1}.
            Платёж банк не принимает. Что проверить?
        - assistant: >-
            Проверьте сам номер: {KZ_IBAN#1:typo} не проходит проверку контрольных цифр,
            в нём, вероятно, опечатка. Запросите у поставщика реквизиты на бланке или
            сверьте с договором. {BIN#1} выглядит корректно.
        - user: >-
            Поставщик подтвердил, что ошибся в одной цифре. Верные реквизиты: {KZ_IBAN#2}.
            Составь короткое письмо в банк с просьбой повторить платёж на {amount#1} тенге.

    - domain: it_incident
      messages:
        - user: >-
            Посмотри, почему не работает подключение к базе. В конфиге стоит
            {SECRET#1:connection_string}, ошибка — connection refused.
        - assistant: >-
            Ошибка connection refused означает, что сервер не принимает соединения на этом
            порту: проверьте, что база запущена и порт открыт на файрволе. И обратите
            внимание: строка {SECRET#1:connection_string} содержит пароль, его лучше вынести
            в переменную окружения и сменить.
        - user: >-
            Порт был закрыт, открыл. Напиши, как правильно вынести пароль из конфига
            в переменные окружения.

    - domain: call_centre
      messages:
        - user: >-
            Запиши обращение: клиент {PERSON#1} сообщает о списании {amount#1} тенге, которого
            не признаёт. Карта {CARD#1}, телефон {PHONE#1}.
        - assistant: >-
            Обращение оформлено. Клиент: {PERSON#1}. Карта: {CARD#1}. Спорная сумма:
            {amount#1} тенге. Контактный телефон: {PHONE#1}. Рекомендую сразу заблокировать
            карту и предложить перевыпуск.
        - user: >-
            Карту {CARD#1} заблокировали. Составь СМС для клиента на номер {PHONE#1} о том,
            что обращение принято и срок рассмотрения — 15 дней.

    - domain: hr
      messages:
        - system: >-
            Ты помощник отдела кадров. Используй официально-деловой стиль.
        - user: >-
            Нужен приказ о переводе. Сотрудник: {PERSON#1}, ИИН {IIN#1}. Переводится из отдела
            продаж в отдел рисков с {date#1}. Новый руководитель — {PERSON#2}.
        - assistant: >-
            Проект приказа: «Перевести {PERSON#1:acc} (ИИН {IIN#1}) из отдела продаж в отдел
            рисков с {date#1}. Непосредственным руководителем назначить {PERSON#2:acc}.»
            Нужна ли строка об изменении оклада?
        - user: >-
            Оклад не меняется. Добавь, что с приказом нужно ознакомить {PERSON#1:acc}
            под подпись, а копию отправить на {EMAIL#1}.

    - domain: insurance
      messages:
        - user: >-
            Составь уведомление о страховой выплате. Получатель: {PERSON#1}, ИИН {IIN#1}.
            Сумма {amount#1} тенге, счёт для зачисления {KZ_IBAN#1}.
        - assistant: >-
            «Уважаемый клиент! По вашему страховому случаю принято решение о выплате
            {amount#1} тенге. Деньги будут перечислены на счёт {KZ_IBAN#1} в течение трёх
            рабочих дней.» В служебной части укажите: {PERSON#1}, {IIN#1}.
        - user: >-
            Хорошо. Добавь абзац: если счёт {KZ_IBAN#1} больше не действует, клиенту нужно
            позвонить по номеру {PHONE#1} до конца недели.

    - domain: contract
      messages:
        - user: >-
            Сверь реквизиты в договоре. У нас записано: ТОО «Орда Ритейл Систем»,
            БИН {BIN#1:typo}, ИИК {KZ_IBAN#1}. Контрагент говорит, что есть ошибка.
        - assistant: >-
            Ошибка, похоже, в первом номере: {BIN#1:typo} не проходит проверку контрольного
            разряда. Счёт {KZ_IBAN#1} корректен. Попросите контрагента прислать свидетельство
            о регистрации и сверьте номер по нему.
        - user: >-
            Прислали свидетельство, правильный БИН {BIN#2}. Подготовь дополнительное
            соглашение об исправлении реквизитов.

    - domain: it_incident
      messages:
        - user: >-
            Пользователь не может войти в почту. Логин {EMAIL#1}, пароль: {SECRET#1:password}.
            Пишет «неверные учётные данные». Что делать?
        - assistant: >-
            Во-первых, пароль нельзя пересылать в открытом виде: {SECRET#1:password} теперь
            нужно считать скомпрометированным и сменить. Во-вторых, проверьте, не заблокирована
            ли учётная запись {EMAIL#1} после нескольких неудачных попыток.
        - user: >-
            Учётка была заблокирована. Как коротко объяснить пользователю правила работы
            с паролями?

    - domain: call_centre
      messages:
        - user: >-
            Клиент оставил два номера: основной {PHONE#1} и запасной {PHONE#2}. Почта
            {EMAIL#1}. Как лучше записать контакты в CRM?
        - assistant: >-
            Запишите основной номер {PHONE#1} в поле «Мобильный», а {PHONE#2} — в поле
            «Дополнительный» с пометкой «запасной». Адрес {EMAIL#1} — в поле «E-mail»,
            и отметьте предпочтительный канал связи.
        - user: >-
            Предпочитает почту. Напиши шаблон первого письма на {EMAIL#1} с подтверждением
            контактных данных.

  kk:
    - domain: loan
      messages:
        - user: >-
            Клиентке хат жазуға көмектесші. Қарыз алушы — {PERSON#1}, ЖСН {IIN#1}, телефоны
            {PHONE#1}. Несие {amount#1} теңгеге мақұлданды, шартқа қол қою үшін бөлімшеге
            шақыру керек.
        - assistant: >-
            Хат жобасы: «Құрметті клиент! Сіздің өтініміңіз {amount#1} теңге сомасына
            мақұлданғанын хабарлаймыз. Шартқа қол қою үшін бөлімшеге келуіңізді сұраймыз.»
            Ішкі карточкаға: {PERSON#1}, {IIN#1}, байланыс нөмірі {PHONE#1}. Шешімнің
            жарамдылық мерзімін қосайын ба?
        - user: >-
            Иә, шешім 30 күн жарамды екенін қос, соңына байланыс үшін {PHONE#1} нөмірін жаз.

    - domain: transfer
      messages:
        - system: >-
            Сен банктің операциялық бөлімінің көмекшісісің. Қысқа әрі нақты жауап бер.
        - user: >-
            Клиент {PERSON#1} {KZ_IBAN#1} шотына жасалған аударымды кері қайтаруды сұрайды:
            алушыны қате көрсеткен. Сомасы {amount#1} теңге. Клиенттен не керек?
        - assistant: >-
            Клиенттің қолы қойылған төлемді кері қайтару туралы өтініш және аударым
            деректемелері керек: алушының шоты {KZ_IBAN#1}, сомасы {amount#1} теңге, операция
            күні. Ақша алушының шотына түсіп қойған болса, оны тек алушының келісімімен
            қайтаруға болады.
        - user: >-
            Өтініш бар. Алушының банкіне {KZ_IBAN#1} шоты бойынша сұрау мәтінін дайында,
            жауапты {EMAIL#1} мекенжайына күтетінімізді көрсет.

    - domain: call_centre
      messages:
        - user: >-
            Клиент ЖСН {IIN#1:typo} деп айтты, бірақ жүйе қабылдамай тұр. Аты-жөні:
            {PERSON#1}. Себебі не болуы мүмкін?
        - assistant: >-
            Меніңше, {IIN#1:typo} нөмірінде қате бар: бақылау разряды сәйкес келмейді.
            {PERSON#1:abl} нөмірді қайта айтуын сұраңыз немесе жеке куәлігімен салыстырыңыз.
        - user: >-
            Жеке куәлігінен қарадым, дұрыс нөмір — {IIN#2}. Ал {IIN#1:typo} клиент жатқа
            айтқан екен. Карточкадағы жазбаны жаңартшы.

    - domain: hr
      messages:
        - system: >-
            Сен кадр бөлімінің көмекшісісің. Ресми іскерлік стильде жаз.
        - user: >-
            Ауыстыру туралы бұйрық керек. Қызметкер: {PERSON#1}, ЖСН {IIN#1}. {date#1} бастап
            сату бөлімінен тәуекелдер бөліміне ауысады. Жаңа басшысы — {PERSON#2}.
        - assistant: >-
            Бұйрық жобасы: «{PERSON#1} (ЖСН {IIN#1}) {date#1} бастап сату бөлімінен тәуекелдер
            бөліміне ауыстырылсын. Тікелей басшысы болып {PERSON#2} тағайындалсын.»
            Лауазымдық жалақының өзгеруі туралы жол қажет пе?
        - user: >-
            Жалақы өзгермейді. Бұйрықпен {PERSON#1:acc} қол қойғызып таныстыру керектігін қос,
            көшірмесін {EMAIL#1} поштасына жіберу керек.

    - domain: insurance
      messages:
        - user: >-
            Сақтандыру төлемі туралы хабарлама құрастыр. Алушы: {PERSON#1}, ЖСН {IIN#1}.
            Сомасы {amount#1} теңге, ақша түсетін шот {KZ_IBAN#1}.
        - assistant: >-
            «Құрметті клиент! Сіздің сақтандыру жағдайыңыз бойынша {amount#1} теңге төлеу
            туралы шешім қабылданды. Ақша үш жұмыс күні ішінде {KZ_IBAN#1} шотына аударылады.»
            Қызметтік бөлікте мынаны көрсетіңіз: {PERSON#1}, {IIN#1}.
        - user: >-
            Жақсы. Мынадай абзац қос: деректемелері өзгерген болса, клиент апта соңына дейін
            {PHONE#1} нөміріне қоңырау шалуы керек.

    - domain: call_centre
      messages:
        - user: >-
            Өтінішті жазып ал: клиент {PERSON#1} өзі жасамаған {amount#1} теңге есептен
            шығарылғанын хабарлады. Картасы {CARD#1}, телефоны {PHONE#1}.
        - assistant: >-
            Өтініш тіркелді. Клиент: {PERSON#1}. Карта: {CARD#1}. Даулы сома: {amount#1} теңге.
            Байланыс телефоны: {PHONE#1}. Картаны бірден бұғаттап, қайта шығаруды ұсынған жөн.
        - user: >-
            {CARD#1} картасы бұғатталды. Клиентке {PHONE#1} нөміріне жіберілетін SMS мәтінін
            жаз: өтініш қабылданды, қарау мерзімі — 15 күн.

    - domain: transfer
      messages:
        - user: >-
            Бухгалтерия жеткізушінің деректемелерін жіберді: ЖСК {KZ_IBAN#1:typo},
            БСН {BIN#1}. Банк төлемді қабылдамай жатыр. Нені тексеру керек?
        - assistant: >-
            Алдымен нөмірдің өзін тексеріңіз: {KZ_IBAN#1:typo} бақылау сандарының тексерісінен
            өтпейді, бір жерінде қате кеткен сияқты. Жеткізушіден деректемелерді бланкіде
            сұраңыз. {BIN#1} дұрыс көрінеді.
        - user: >-
            Жеткізуші бір цифрдан қателескенін растады. Дұрыс деректеме: {KZ_IBAN#2}.
            Банкке {amount#1} теңге төлемді қайталауды сұрап қысқа хат жаз.

    - domain: it_incident
      messages:
        - user: >-
            Дерекқорға неге қосыла алмай жатқанымызды қарашы. Конфигурацияда
            {SECRET#1:connection_string} тұр, қатесі — connection refused.
        - assistant: >-
            Connection refused қатесі сервердің бұл портта қосылымдарды қабылдамай тұрғанын
            білдіреді: дерекқордың іске қосылғанын және порттың ашық екенін тексеріңіз.
            Назар аударыңыз: {SECRET#1:connection_string} жолында құпиясөз бар, оны орта
            айнымалысына шығарып, ауыстырған дұрыс.
        - user: >-
            Порт жабық екен, аштым. Құпиясөзді конфигурациядан орта айнымалыларына қалай дұрыс
            шығаруға болатынын жазып бер.

  mixed:
    - domain: loan
      messages:
        - user: >-
            Сәлем! Клиентке письмо жазуға көмектесші. Заёмщик — {PERSON#1}, ИИН {IIN#1},
            телефоны {PHONE#1}. Кредит {amount#1} теңгеге одобрен.
        - assistant: >-
            Міне, черновик: «Құрметті клиент! Ваша заявка одобрена на сумму {amount#1} теңге,
            шартқа қол қою үшін бөлімшеге келіңіз.» Ішкі карточкаға: {PERSON#1}, {IIN#1},
            {PHONE#1}.
        - user: >-
            Жақсы, рахмет. Соңына «сұрақтар бойынша {PHONE#1} нөміріне хабарласыңыз» деп
            қосып қой.

    - domain: transfer
      messages:
        - user: >-
            Клиент {PERSON#1} переводты отозвать еткісі келеді, {KZ_IBAN#1} шотына қате кетіп
            қалған, сумма {amount#1} теңге. Не істеу керек?
        - assistant: >-
            Клиенттен заявление на отзыв платежа алу керек, онда реквизиттер көрсетіледі:
            счёт получателя {KZ_IBAN#1}, сумма {amount#1} теңге. Ақша зачислена болса, возврат
            тек получательдің келісімімен жасалады.
        - user: >-
            Заявление бар. Банк получателя үшін {KZ_IBAN#1} шоты бойынша запрос мәтінін
            дайындашы, жауапты {EMAIL#1} поштасына күтеміз.

    - domain: call_centre
      messages:
        - user: >-
            Клиент ИИН {IIN#1:typo} деп айтты, система қабылдамайды. ФИО: {PERSON#1}.
            Неге олай?
        - assistant: >-
            Скорее всего, {IIN#1:typo} нөмірінде опечатка бар, контрольный разряд сәйкес
            келмейді. Клиенттен нөмірді қайта сұраңыз немесе удостоверениемен салыстырыңыз.
        - user: >-
            Удостоверениеден қарадым, дұрысы — {IIN#2}. {IIN#1:typo} дегенді клиент жатқа
            айтқан. Карточкадағы заметканы жаңартшы.

    - domain: call_centre
      messages:
        - user: >-
            Обращение жазып ал: клиент {PERSON#1} картасынан {amount#1} теңге списали дейді,
            өзі жасамаған. Карта {CARD#1}, тел. {PHONE#1}.
        - assistant: >-
            Обращение оформлено. Клиент: {PERSON#1}. Карта: {CARD#1}. Спорная сумма:
            {amount#1} теңге. Телефон: {PHONE#1}. Картаны бірден блоктаған дұрыс.
        - user: >-
            {CARD#1} картасын заблокировали. Клиентке {PHONE#1} нөміріне СМС мәтінін жазып бер.

    - domain: hr
      messages:
        - user: >-
            Приказ керек: {PERSON#1}, ИИН {IIN#1}, {date#1} бастап отдел продаж-дан отдел
            рисков-қа ауысады. Жаңа руководитель — {PERSON#2}.
        - assistant: >-
            Приказ жобасы: «{PERSON#1} (ИИН {IIN#1}) {date#1} бастап отдел рисков-қа
            ауыстырылсын, непосредственный руководитель — {PERSON#2}.» Оклад өзгере ме?
        - user: >-
            Оклад өзгермейді. Приказбен {PERSON#1:acc} таныстыру керек, көшірмесін {EMAIL#1}
            адресіне жіберіңіз деп қос.

    - domain: it_incident
      messages:
        - user: >-
            Почтаға кіре алмай жатыр. Логин {EMAIL#1}, пароль: {SECRET#1:password}.
            «Неверные учётные данные» деп шығады.
        - assistant: >-
            Біріншіден, парольді ашық түрде жіберуге болмайды: {SECRET#1:password} енді
            скомпрометирован, ауыстыру керек. Екіншіден, {EMAIL#1} учёткасы блокталып
            қалмағанын тексеріңіз.
        - user: >-
            Учётка блокталған екен, аштым. Пайдаланушыға пароль ережелерін қысқаша қалай
            түсіндіруге болады?

  en:
    - domain: loan
      messages:
        - system: >-
            You are an assistant for a bank's lending team. Keep answers short.
        - user: >-
            Help me write to a client. The borrower is {PERSON#1}, IIN {IIN#1}, phone
            {PHONE#1}. The loan is approved for KZT {amount#1} and we need to invite the client
            to sign the agreement.
        - assistant: >-
            Here is a draft: "Dear client, your application has been approved for
            KZT {amount#1}. Please visit the branch to sign the agreement." For the internal
            file: {PERSON#1}, {IIN#1}, contact number {PHONE#1}. Shall I add how long
            the decision is valid?
        - user: >-
            Yes, say that the decision is valid for 30 days and put {PHONE#1} at the end
            as the contact number.

    - domain: transfer
      messages:
        - user: >-
            A client, {PERSON#1}, wants to recall a transfer to account {KZ_IBAN#1}:
            the beneficiary was wrong. The amount is KZT {amount#1}. What do we need from
            the client?
        - assistant: >-
            A signed recall request with the transfer details: beneficiary account
            {KZ_IBAN#1}, amount KZT {amount#1} and the transaction date. If the money has
            already been credited, it can be returned only with the beneficiary's consent.
        - user: >-
            We have the request. Draft the message to the beneficiary's bank about account
            {KZ_IBAN#1} and say that we expect the reply at {EMAIL#1}.

    - domain: contract
      messages:
        - user: >-
            Please check this request to the tax office: "We ask you to confirm the
            registration of a non-resident, IIN {IIN#1:undated}, contract {doc_no#1}."
        - assistant: >-
            The wording is fine. I would add the date of the contract and your company's full
            name. Also double-check the number {IIN#1:undated}: it carries no birth date,
            which is unusual. If it was copied from the certificate without mistakes, there
            is nothing to fix.
        - user: >-
            The number is right; {IIN#1:undated} is what the certificate says. Add our
            BIN {BIN#1} and the contact phone {PHONE#1} to the request.

    - domain: transfer
      messages:
        - user: >-
            The accountant sent the supplier's details: IBAN {KZ_IBAN#1:typo}, BIN {BIN#1}.
            The bank rejects the payment. What should we check?
        - assistant: >-
            Start with the number itself: {KZ_IBAN#1:typo} fails the check-digit test, so it
            probably has a typo. Ask the supplier for the details on letterhead. {BIN#1}
            looks correct.
        - user: >-
            The supplier confirmed one wrong digit. The correct details: {KZ_IBAN#2}. Write
            a short letter asking the bank to repeat the payment of KZT {amount#1}.

    - domain: call_centre
      messages:
        - user: >-
            Log a ticket: the client, {PERSON#1}, reports a charge of KZT {amount#1} that
            the client did not make. Card {CARD#1}, phone {PHONE#1}.
        - assistant: >-
            Ticket logged. Client: {PERSON#1}. Card: {CARD#1}. Disputed amount:
            KZT {amount#1}. Contact phone: {PHONE#1}. I recommend blocking the card right
            away and offering a replacement.
        - user: >-
            Card {CARD#1} is blocked. Write an SMS to {PHONE#1} saying that the ticket
            is accepted and will be reviewed within 15 days.

    - domain: it_incident
      messages:
        - user: >-
            Our integration returns 401. The request sends the header
            Authorization: Bearer {SECRET#1:bearer_token}. What could be wrong?
        - assistant: >-
            A 401 means the token was not accepted: it may have expired or been issued for
            another environment. Note that you have just pasted a live credential: treat
            {SECRET#1:bearer_token} as exposed and reissue it. Then check the token's expiry
            and audience.
        - user: >-
            It had expired. How should we store the new token so that it does not end up
            in tickets again?
