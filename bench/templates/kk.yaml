# Benchmark templates in Kazakh: original business text, written for this benchmark.
#
# The slots and the rules are those of ru.yaml. A PERSON in an oblique case is tagged with the
# case of Kazakh grammar: gen (ілік), dat (барыс), acc (табыс), loc (жатыс), abl (шығыс),
# ins (көмектес). The name is written in its base form all the same, so the ending that would
# join it is left out of the text. After ЖШС or АҚ stands the name of a company; after ЖК
# stands a person, the sole proprietor, and so a {PERSON} slot.

lang: kk

templates:
  loan:
    - >-
      Несие комитеті өтінімді мақұлдады: қарыз алушы {PERSON}, ЖСН {IIN}, сомасы {amount}
      теңге, мерзімі 36 ай.
    - >-
      Қайырлы күн! Клиент {PERSON} тұтынушылық несиеге өтінім берді. Байланыс телефоны:
      {PHONE}, электрондық поштасы: {EMAIL}.
    - >-
      {PERSON:dat} несие беруден бас тартылды: ЖСН {IIN} бойынша басқа банкте мерзімі өткен
      берешек анықталды.
    - >-
      Ипотекалық өтінім № {order_no}: қарыз алушы {PERSON}, ЖСН {IIN}; тең қарыз алушы
      {PERSON}, ЖСН {IIN}. Бастапқы жарна {amount} теңге.
    - >-
      Шағын бизнеске арналған несие: қарыз алушы «Ақ Жайық Құрылыс Сервис» ЖШС, БСН {BIN},
      кепілгер — директор {PERSON}.
    - >-
      Несие картасының лимитін {amount} теңгеге дейін көтеру туралы шешім қабылданды.
      Карта нөмірі: {CARD}, иесі — {PERSON}.
    - >-
      Қарызды қайта құрылымдау туралы өтініш {date} күні қабылданды. Қарыз алушының ЖСН-і:
      {IIN}, қалған берешек — {amount} теңге.
    - >-
      Андеррайтер {PERSON:abl} соңғы алты айдағы табысы туралы анықтама мен {KZ_IBAN} шоты
      бойынша үзінді көшірме сұратты.
    - >-
      Кепіл беруші {PERSON} (ЖСН {IIN}) 2020 жылы шығарылған автокөлікті кепілге қояды,
      бағалау құны {amount} теңге.
    - >-
      Несие мерзімінен бұрын өтелді: {CARD} картасынан {amount} теңге есептен шығарылды.
      Берешектің жоқтығы туралы анықтама {EMAIL} мекенжайына жіберілді.
    - >-
      Жұмыс берушіні растауды сұраймыз: «Нұр Отау Сауда» ЖШС, БСН {BIN}. Кадр бөліміндегі
      байланыс тұлғасы — {PERSON}, {PHONE}.
    - >-
      Транш {KZ_IBAN} шотына аударылды. Алушы — «Жерұйық Агро Өнім» ЖШС, БСН {BIN},
      сомасы {amount} теңге.
    - >-
      Бизнеске арналған несиеге ЖК {PERSON:abl} өтінім түсті: жылдық айналымы {amount} теңге,
      байланыс телефоны {PHONE}.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      {PERSON} несие бойынша төлем кестесін өзгертуді сұрайды. ЖСН {IIN}, қалған қарыз
      {amount} теңге.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} тұтынушылық несиеге өтінім берді. ЖСН {IIN}, телефоны {PHONE}.
    - >-
      {PERSON} картасының лимитін көтеруді сұрайды, карта нөмірі {CARD}. ЖСН {IIN}.

  transfer:
    - >-
      {KZ_IBAN} шотына {amount} теңге аударуды сұраймын. Алушы — {PERSON}, төлем мақсаты —
      қарызды қайтару.
    - >-
      Аударым келіп түспеді: жіберуші {PERSON}, карта {CARD}, сомасы {amount} теңге,
      операция күні {date}. Клиент төлемді табуды сұрайды.
    - >-
      Төлем деректемелері: «Көкжиек Жиһаз Әлемі» ЖШС, БСН {BIN}, ЖСК {KZ_IBAN}.
      Шот-фактура № {order_no}.
    - >-
      Жалақы аудару: {PERSON}, ЖСН {IIN}, шот {KZ_IBAN}, төленетін сома {amount} теңге.
    - >-
      Клиент {PERSON} {CARD} картасындағы автотөлемді өшіруді сұрайды: ақша айына екі рет
      ұсталып жатыр.
    - >-
      Өз шоттарыңыз арасындағы аударымды растаңыз: {KZ_IBAN} шотынан {KZ_IBAN} шотына,
      сомасы {amount} теңге.
    - >-
      Телефон нөмірі бойынша аударым «өңделуде» күйінде тұр. Нөмір: {PHONE}, сомасы {amount}
      теңге, алушы қосымшада {PERSON} деп көрсетілген.
    - >-
      Қате төлем: бухгалтерия {amount} теңгені жеткізушінің шотына емес, {KZ_IBAN} шотына
      жіберіп қойды. Қаражатты қайтаруды сұраймыз.
    - >-
      № {order_no} чек бойынша қайтарым: ақша {CARD} картасына бес жұмыс күні ішінде түседі.
      Хабарлама {EMAIL} поштасына жіберілді.
    - >-
      Клиент {date} күні {CARD} картасынан {amount} теңге күмәнді түрде есептен шығарылғанын
      хабарлады. Карта бұғатталды.
    - >-
      Алимент {PERSON:gen} жалақысынан ұсталып, әр айдың 10-ына дейін {KZ_IBAN} шотына
      аударылады.
    - >-
      Төлем тапсырмасы {doc_no}: төлеуші «Арқа Жылу Сервис» АҚ, БСН {BIN}; алушы {PERSON},
      ЖСН {IIN}, шоты {KZ_IBAN}.
    - >-
      Үй-жайды жалға алғаны үшін төлем: алушы — ЖК {PERSON}, ЖСН/БСН {IIN}, ЖСК {KZ_IBAN},
      сомасы {amount} теңге.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      Аударым жетпеді. {PERSON} ақшаны {KZ_IBAN} шотына күтіп отыр.

  insurance:
    - >-
      Сақтандыру жағдайы № {order_no}: сақтанушы {PERSON}, ЖСН {IIN}, жол-көлік оқиғасы
      {date} күні болған, мәлімделген залал {amount} теңге.
    - >-
      Сақтандыру төлемі мақұлданды. {amount} теңгені {KZ_IBAN} шотына аудару қажет,
      алушы — {PERSON}.
    - >-
      Залал бойынша құжаттарды толықтыруды сұраймыз: техникалық паспорттың көшірмесі мен
      {PERSON:gen} өтініші. Сканерленген нұсқасын {EMAIL} мекенжайына жіберуге болады.
    - >-
      КАСКО полисі {PERSON:dat} рәсімделді, ЖСН {IIN}. Сақтандыру сыйлықақысы {amount} теңге
      {CARD} картасымен төленді.
    - >-
      Өмірді сақтандыру шарты бойынша пайда алушы — {PERSON}, ЖСН {IIN}.
      Байланыс телефоны: {PHONE}.
    - >-
      Сарапшы автокөлікті ертең қарайды. Иесімен байланысу: {PERSON}, {PHONE}.
      Қарау орны — Сәтбаев көшесі, 90.
    - >-
      Корпоративтік медициналық сақтандыру шарты: сақтанушы «Дәнекер Фарм Импорт» ЖШС,
      БСН {BIN}, сақтандырылған қызметкерлер саны — 124.
    - >-
      Клиент сақтандыру шартын бұзып, сыйлықақының бір бөлігін {CARD} картасына қайтаруды
      сұрайды. Өтініш {date} күні қабылданды.
    - >-
      Пәтерді су басқан: сақтанушы {PERSON}, {PHONE}, {EMAIL}. Әрлеу жұмыстарына келген
      залал {amount} теңгеге бағаланды.
    - >-
      Регресстік талап апатқа кінәлі тұлғаға қойылды: {PERSON}, ЖСН {IIN},
      талап сомасы {amount} теңге.
    - >-
      {doc_no} полисінің қолданылу мерзімі {date} күні аяқталады. Ұзарту үшін менеджерге
      {PHONE} нөміріне қоңырау шалыңыз немесе {EMAIL} поштасына жазыңыз.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} сақтандыру жағдайы туралы хабарлады: залал {amount} теңгеге бағаланды. Телефоны:
      {PHONE}.

  hr:
    - >-
      № {doc_no} бұйрық: {PERSON} {date} бастап тәуекелдер бөлімінің жетекші маманы
      лауазымына қабылдансын, лауазымдық жалақысы {amount} теңге.
    - >-
      Құрметті әріптестер! Дүйсенбіден бастап бізге жаңа талдаушы — {PERSON} қосылады.
      Жұмыс поштасы: {EMAIL}.
    - >-
      Рұқсаттама рәсімдеу үшін қызметкердің деректерін жіберіңізші: {PERSON}, ЖСН {IIN},
      ұялы телефоны {PHONE}.
    - >-
      Өтініш: {PERSON} {date} бастап 14 күнтізбелік күнге жыл сайынғы еңбек демалысын беруді
      сұрайды.
    - >-
      Анықтама {PERSON:dat}, ЖСН {IIN}, оның {date} бастап компанияда бас бухгалтер
      лауазымында жұмыс істейтінін растау үшін берілді.
    - >-
      Жалақы жобасы: қызметкер {PERSON}, жалақы аударылатын шот {KZ_IBAN}, картасы {CARD}.
    - >-
      {PERSON:ins} жасалған еңбек шарты тараптардың келісімі бойынша бұзылады.
      Пайдаланылмаған демалыс үшін өтемақы — {amount} теңге.
    - >-
      Атырауға іссапар: {PERSON}, {date} мен {date} аралығы. Тәулікақыны {CARD} картасына
      аудару қажет.
    - >-
      «Жүйелік әкімші» бос орнына үміткер: {PERSON}, {PHONE}, {EMAIL}. Сұхбат бейсенбі күні
      сағат 15:00-ге белгіленді.
    - |-
      Қызметкердің сауалнамасы
      Аты-жөні: {PERSON}
      ЖСН: {IIN}
      Телефоны: {PHONE}
      Электрондық поштасы: {EMAIL}
      Банк шоты: {KZ_IBAN}
    - >-
      Бала тууына байланысты {PERSON:dat} {amount} теңге көлемінде материалдық көмек
      тағайындалды. Қаражат {KZ_IBAN} шотына аударылсын.
    - >-
      Еңбек тәртібін бұзғаны үшін {PERSON:dat} сөгіс жариялансын. Негіздеме: бөлім басшысының
      {date} күнгі қызметтік жазбасы.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      {PERSON} бүгін жұмысқа шыққан жоқ, {date} дейін еңбек демалысында. Шұғыл сұрақтар
      бойынша {PHONE} нөміріне хабарласуға болады.

    - >-
      Еңбек даулары жөніндегі комиссия отырысының № {doc_no} хаттамасы, {date}. Қатысқандар:
      {PERSON:surname}, {PERSON:surname} және {PERSON:surname}. Төраға: {PERSON:surname}.
      Хатшы: {PERSON}. {PERSON:surname} — бірінші мәселе бойынша баяндамашы.
    - |-
      Аттестаттау комиссиясының құрамы, {date}:
      1. {PERSON:surname}
      2. {PERSON:surname}
      3. {PERSON:surname}
      Жауапты: {PERSON:surname}
      Тегі: {PERSON:surname}
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} {date} күнінен бастап жұмысқа шығады. Рұқсатнама мен {EMAIL} поштасын жұмаға дейін
      рәсімдеу керек.
  contract:
    - >-
      «Береке Инжиниринг Сервис» ЖШС, БСН {BIN}, Жарғы негізінде әрекет ететін директоры
      {PERSON} арқылы, бұдан әрі «Орындаушы» деп аталады.
    - >-
      Тараптардың деректемелері. Тапсырыс беруші: «Каспий Мұнай Жабдық» АҚ, БСН {BIN},
      ЖСК {KZ_IBAN}. Орындаушы: жеке кәсіпкер, ЖСН {IIN}.
    - >-
      {date} күнгі № {doc_no} жалға беру шарты. Жалға беруші: {PERSON}, ЖСН {IIN}.
      Жалдау ақысы — айына {amount} теңге.
    - >-
      Осы Шарт бойынша төлем актіге қол қойылған күннен бастап бес банк күні ішінде
      Жеткізушінің {KZ_IBAN} есепшотына жүргізіледі.
    - >-
      № {order_no} орындалған жұмыстар актісіне Тапсырыс беруші атынан {PERSON},
      Мердігер атынан {PERSON} қол қойды.
    - >-
      Шарт бойынша хабарламалар {EMAIL} электрондық мекенжайына және {PHONE} телефонына
      жіберіледі.
    - >-
      Сенімхат {PERSON:dat}, ЖСН {IIN}, «Мерей Транс Карго» ЖШС мүддесін мемлекеттік кірістер
      органдарында білдіру үшін берілді.
    - >-
      Жеке тұлғалар арасындағы қарыз шарты: қарыз беруші {PERSON}, ЖСН {IIN}; қарыз алушы
      {PERSON}, ЖСН {IIN}; қарыз сомасы {amount} теңге.
    - >-
      Жеткізуші жабдықты {date} дейін жеткізуге міндеттенеді. Жеткізушінің байланыс тұлғасы:
      {PERSON}, тел. {PHONE}, {EMAIL}.
    - >-
      Қызмет көрсету шарты өзін-өзі жұмыспен қамтыған орындаушымен жасалды: {PERSON}, {IIN}.
      Сыйақы {CARD} картасына аударылады.
    - >-
      Тараптар шартты {date} бастап бұзуға келісті. Қамтамасыз ету төлемі {amount} теңге
      {KZ_IBAN} шотына қайтарылады.
    - >-
      Жеткізу шарты ЖК {PERSON:ins} (ЖСН {IIN}) жасалды. Төлем үш банк күні ішінде {KZ_IBAN}
      шотына аударылады.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      Шарт қол қоюға дайын. {PERSON} мен {PERSON} оған бейсенбіде қол қояды, төлем деректемелері:
      {KZ_IBAN}.

  call_centre:
    - >-
      {date} күнгі қоңырау. Клиент {PERSON} ақшаның екі рет есептен шығарылғанына шағымданды,
      сағат 18:00-ден кейін {PHONE} нөміріне қайта қоңырау шалуды сұрайды.
    - >-
      Клиент қосымшаға кіре алмай отыр, коды бар SMS келмейді. Сауалнамадағы нөмірі: {PHONE},
      ЖСН {IIN}.
    - >-
      № {order_no} өтініш: клиент {CARD} картасын бұғаттан шығаруды сұрайды. Жеке басы кодтық
      сөз арқылы расталды.
    - >-
      Қайта қоңырау шалу керек: {PHONE}. Сұрағы — несиені мерзімінен бұрын өтеу,
      клиент — {PERSON}.
    - >-
      Клиент ЖСН-ін айтты: {IIN}. Төлем кестесін {EMAIL} поштасына жіберуді өтінді.
    - >-
      Оператор {PERSON}: клиент депозит мөлшерлемесін сұрады, Гоголь көшесі, 15
      мекенжайындағы бөлімшеге келуге уәде берді.
    - >-
      Клиент профильдегі телефон нөмірін ауыстырғысы келеді: ескісі {PHONE}, жаңасы {PHONE}.
      Растау үшін жеке куәлікпен бөлімшеге келу қажет.
    - >-
      Кіріс қоңырау, тақырыбы — жоғалған карта. {CARD} картасы иесінің өтініші бойынша
      бұғатталды, иесі — {PERSON}.
    - >-
      Клиент {PERSON} (ЖСН {IIN}) аударым үшін алынған {amount} теңге комиссияға келіспейді.
      Өтініш тіркелді, жауап беру мерзімі — үш жұмыс күні.
    - >-
      Абонент {KZ_IBAN} шотына аударымның неге түспегенін сұрайды. Жіберуші —
      «Тұмар Маркет Плюс» ЖШС, төлем {date} күні жасалған.
    - >-
      Хабарласа алмадық: {PHONE}. Клиент — {PERSON}, мерзімі өткен берешек 12 күн, ертең
      түске дейін қайта қоңырау шалу керек.
    - >-
      Клиент {PERSON} үзінді көшірмелерді қағаз түрінде емес, {EMAIL} поштасына алғысы келеді.
      Келісімі жазылып алынды.
    - >-
      Кәсіпкерден қоңырау түсті: ЖК {PERSON} эквайрингті қоса алмай жатыр, {PHONE} нөміріне
      қайта қоңырау шалуды сұрайды.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      Қоңырау сағат 14:20-да түсті. {PERSON} картасының бұғатталғанын айтты, карта нөмірі
      {CARD}.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} бүгін үшінші рет қоңырау шалды: {PHONE} нөміріне растау коды келмейді.

  it_incident:
    - >-
      Инцидент INC-{order_no}: GitLab токені {SECRET:gitlab_token} ашық репозиторийге түсіп
      кеткен. Токеннің күші жойылды, пайплайндар жаңасымен қайта іске қосылды.
    - >-
      Төлем сервисінің журналында Authorization: Bearer {SECRET:bearer_token} тақырыбы ашық
      күйінде жазылып жатыр. Журналға шығаруды бүркемелеп, токенді қайта шығару керек.
    - >-
      Кезекші инженер {PERSON} staging конфигурациясынан дерекқорға қосылу жолын тапты:
      {SECRET:connection_string}. Құпиясөз ауыстырылды.
    - >-
      Пайдаланушы өтінімге VPN құпиясөзін жазып жіберген — құпиясөз: {SECRET:password}.
      Есептік жазбаның құпиясөзі ауыстырылды, қызметкерге ереже ескертілді.
    - >-
      feature/chat-bot тармағына .env файлы коммиттелген, ішінде
      ANTHROPIC_API_KEY={SECRET:anthropic_api_key} жолы бар. Кілттің күші жойылды.
    - >-
      Мердігер ортақ чатқа AWS кілттерін жариялап қойған:
      AWS_ACCESS_KEY_ID={SECRET:aws_access_key_id},
      AWS_SECRET_ACCESS_KEY={SECRET:aws_secret_access_key}. Кілттер өшірілді.
    - >-
      Журналдарға дербес деректер жазылып кеткен: скоринг сервисі клиенттердің ЖСН-ін жазып
      отыр, мысалы — {IIN}. Түзетуге жауапты — {PERSON}, {EMAIL}.
    - |-
      Тест серверінде жабық кілт ашық жатқан:
      {SECRET:private_key}
      Кілт жойылды, сертификат қайта шығарылды.
    - >-
      Slack ботының токені {SECRET:slack_token} ортақ арнадағы скриншотқа түсіп қалған.
      Токен қайта шығарылды, скриншот өшірілді.
    - >-
      Мониторинг: auth сервисі 500 қатесін қайтарды, оқиғаның уақыт белгісі {timestamp_ms}.
      Трассировкада {SECRET} кілті көрініп тұр, сұраныс идентификаторы {uuid}.
