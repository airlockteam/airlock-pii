# Negatives: business text with nothing in it to find, and with much that looks as if there were.
#
# A negative holds no entity slot. What it holds instead:
# - {number_12}: twelve digits with a wrong IIN/BIN check digit; {number_12_valid}: twelve digits
#   with the right one, but neither a birth date nor the structure of a BIN, and no word that
#   calls them an IIN (synthetic.iin(dated=False));
# - {number_16}: sixteen digits that fail the Luhn check; {order_no_11}: eleven digits that begin
#   like a mobile number, numbered as a document: right after a word such as "заказ" or "order",
#   right after "№" or "#", or, in Kazakh word order, right before "нөмірлі тапсырыс";
# - order and contract numbers, dates and tenge amounts ({order_no}, {doc_no}, {date}, {amount});
# - {uuid}, {git_sha}, {timestamp_ms} and the word "password" with nothing secret after it;
# - streets and avenues named after people, cities, and invented companies after ТОО, ЖШС, АО
#   and АҚ: what a detector of names must leave alone.
#
# No twelve-digit look-alike stands after a word that calls it an IIN or a BIN: a reader would
# then take it for one, and the text would not be a negative.
#
# Companies are invented; streets and cities are real places.

templates:
  ru:
    loan:
      - >-
        Кредитный комитет рассмотрел заявку № {number_12} от {date}: запрошено {amount} тенге
        на 48 месяцев, решение перенесено на следующее заседание.
      - >-
        С {date} ставка по ипотечной программе не меняется. Первоначальный взнос — от 20%,
        максимальная сумма для Алматы и Астаны — {amount} тенге.
      - >-
        Заявка {number_12_valid} отклонена скорингом: недостаточный стаж на последнем месте
        работы. Повторная подача возможна через 60 дней.
      - >-
        Отделение на улице Байтурсынова, 65 принимает заявки на автокредит с 9:00 до 18:00,
        в субботу — до 14:00. За {date} принято 37 заявок на сумму {amount} тенге.
    transfer:
      - >-
        Платёжное поручение № {order_no} от {date} на сумму {amount} тенге исполнено,
        референс операции {number_12_valid}.
      - >-
        Комиссия за межбанковский перевод составит 0,2%, минимум 300 тенге. Переводы свыше
        {amount} тенге подтверждаются звонком из банка.
      - >-
        Транзакция {number_16} отклонена эквайером: код ответа 05. Повторите попытку позже
        или обратитесь в свой банк.
      - >-
        Курс на {date}: доллар 478,50, евро 512,30, рубль 5,12. Лимит на обмен без
        подтверждающих документов — {amount} тенге.
      - >-
        Заказ № {order_no_11} оплачен, чек отправлен в приложение. Возврат возможен в течение
        14 дней.
    insurance:
      - >-
        Убыток № {number_12} зарегистрирован {date}. Осмотр повреждённого автомобиля состоится
        на СТО по адресу: проспект Райымбека, 212.
      - >-
        Тариф по ОГПО для Шымкента вырос на 4%. Стандартный полис на год стоит от {amount}
        тенге, со скидкой за безаварийную езду — дешевле.
      - >-
        Номер полиса {number_16}, период страхования — 12 месяцев с {date}. Франшиза
        не применяется.
      - >-
        Страховая компания «Номад Гарант Полис» закрыла квартал: выплачено {amount} тенге,
        дело № {order_no} передано в суд.
      # Benchmark v1, from the review of names, round 3: ordinary words that end like a surname, in
      # a list, and a form that points to where the name is.
      - |-
        Форма заявления {doc_no}
        Фамилия: Стр. 2 анкеты
        Дата: {date}
    hr:
      - >-
        Приказ № {doc_no} от {date}: утвердить график отпусков на следующий год и довести
        его до сотрудников под подпись.
      - >-
        Вакансия: бухгалтер по расчёту заработной платы, город Караганда, оклад от {amount}
        тенге. Резюме принимаются до {date}.
      - >-
        Табельный номер {order_no}: отработано 168 часов, сверхурочных нет. Ведомость
        № {number_12} передана в бухгалтерию.
      - >-
        Корпоративное обучение пройдёт {date} в конференц-зале на улице Кунаева, 8. Тренинг
        ведёт компания «Билим Про Тренинг», начало в 10:00.
      - >-
        Протокол № {doc_no} от {date}. Статус: Одобрен. Тип: Договоров. Разделы: Общие положения,
        Порядок расчётов и Ответственность сторон. Срок исполнения: 30 дней.
      - |-
        Повестка заседания от {date}:
        - Отчёт за квартал
        - Бюджет отдела
        - Разное
        Кворум: Имеется. Итог — {amount} тенге, решение — отложить.
      # Benchmark v1, from the review of names, round 3: ordinary words that end like a surname, in
      # a list, and a form that points to where the name is.
      - |-
        Меню корпоративного обеда на {date}
        Ингредиенты: Калина, Рябина, Осина.
        Стоимость на человека — {amount} тенге.
      - |-
        Анкета кандидата № {order_no}
        ФИО: См. приложение.
        Дата подачи: {date}
    contract:
      - >-
        Договор поставки № {doc_no} от {date} заключён между ТОО «Сарыарка Трейд Комплект»
        и АО «Жетысу Логистик Сервис», сумма договора {amount} тенге.
      - >-
        Стороны согласовали продление срока действия договора № {doc_no} до {date}. Остальные
        условия остаются без изменений.
      - >-
        Неустойка составляет 0,1% от суммы просроченного платежа за каждый день, но не более
        10% от цены договора, то есть не более {amount} тенге.
      - >-
        Номер государственной регистрации договора: {number_12_valid}. Объект — нежилое
        помещение, город Актобе, проспект Абилкайыр хана, 40.
      - >-
        Тендер № {number_12}: поставка серверного оборудования, начальная цена {amount} тенге,
        заявки принимаются до {date} включительно.
      # Benchmark v1, from the review of names, round 3: ordinary words that end like a surname, in
      # a list, and a form that points to where the name is.
      - |-
        Спецификация к договору {doc_no}
        Товары: Телятина, Оленина, Ветчина.
        Сумма {amount} тенге, поставка до {date}.
    call_centre:
      - >-
        Обращение № {order_no}: клиент спросил, как добраться до отделения на улице Абая, 52.
        Ближайшая остановка — «Проспект Сейфуллина», работаем с 9:00 до 18:00.
      - >-
        Обращение № {number_12} закрыто: клиенту разъяснили условия кэшбэка, претензий нет.
        Оценка качества — 5 из 5.
      - >-
        За смену {date} принято 214 звонков, среднее время ожидания — 42 секунды. Чаще всего
        спрашивали про комиссию {amount} тенге за обслуживание.
      - >-
        Абонент уточнил статус заказа № {order_no_11}. Сообщили, что доставка в Павлодар
        займёт три дня.
      # Benchmark v1, from the review of names, round 3: ordinary words that end like a surname, in
      # a list, and a form that points to where the name is.
      - |-
        Состав заказа № {order_no}:
        - Малина
        - Смородина
        - Калина
        Доставка {date}.
    it_incident:
      - >-
        После релиза {git_sha} сервис отчётов возвращает ошибку 500. Идентификатор
        трассировки: {uuid}. Откат запланирован на вечер.
      - >-
        Заявка № {order_no}: пароль от гостевого Wi-Fi спросите у администратора
        на ресепшене, его меняют каждый понедельник.
      - >-
        Задача DATA-{order_no}: пакетная загрузка упала на записи {number_12_valid}, метка
        времени {timestamp_ms}. Перезапуск прошёл успешно.
      - >-
