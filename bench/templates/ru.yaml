# Benchmark templates in Russian: original business text, written for this benchmark.
#
# A value that has to be found is a slot in capitals ({PERSON}, {IIN}, {BIN}, {KZ_IBAN}, {CARD},
# {PHONE}, {EMAIL}, {SECRET}); the generator fills it with a value from airlock_pii.synthetic.
# A slot in small letters ({amount}, {date}, {doc_no}, {order_no}, ...) is a look-alike that is
# no entity. {PERSON:dat} marks a name that stands in an oblique case: gen, dat, acc, ins, prep.
# {PERSON:surname} is a surname with nothing next to it, as minutes and rosters list people.
# {SECRET:jwt} asks for a kind of secret. bench/slots.py has the grammar.
#
# Rules for whoever adds a template:
# - Nothing that is an entity is written out. No name of a person, no phone number, no address
#   of a mailbox: every one of them is a slot, or the labels would be incomplete.
# - Companies are invented; if one shares its name with a real company, that is a coincidence.
#   Streets and cities are real places. Hosts are under .test or example.com.
# - After ТОО or АО stands the name of a company, written out. After ИП stands a person, the
#   sole proprietor, and so a {PERSON} slot.
# - Write the text the way people write it, not the way a detector would like it.

lang: ru

templates:
  loan:
    - >-
      Кредитный комитет одобрил заявку: заёмщик {PERSON}, ИИН {IIN}, сумма {amount} тенге
      на 36 месяцев под 18,5% годовых.
    - >-
      Прошу подготовить решение по заявке № {order_no}. Клиент — {PERSON}, ИИН {IIN},
      созаёмщик — {PERSON}, ИИН {IIN}.
    - >-
      В выдаче потребительского кредита {PERSON:dat} отказано: по ИИН {IIN} найдена просрочка
      более 90 дней в другом банке.
    - >-
      Заявка на ипотеку от {date}: {PERSON}, {IIN}, телефон {PHONE}. Первоначальный взнос
      {amount} тенге, объект — квартира в Астане.
    - >-
      Андеррайтер запросил у {PERSON:gen} справку о доходах за шесть месяцев и выписку
      по счёту {KZ_IBAN}.
    - >-
      Решение кредитного комитета № {doc_no}: увеличить лимит по кредитной карте {CARD}
      до {amount} тенге, держатель — {PERSON}.
    - >-
      Микрокредит на развитие бизнеса: заёмщик — ТОО «Арна Сауда Групп», БИН {BIN},
      поручитель — директор {PERSON}, ИИН {IIN}.
    - >-
      Клиент {PERSON} подаёт заявку через мобильное приложение. Для связи указан номер {PHONE}
      и почта {EMAIL}, ответ нужен до конца недели.
    - >-
      Реструктуризация займа по договору {doc_no}: заёмщик {PERSON} просит перенести платёж,
      остаток долга {amount} тенге. ИИН для проверки: {IIN}.
    - >-
      Скоринг вернул отказ. Проверьте, пожалуйста, вручную: {IIN}, заявленный доход {amount}
      тенге, место работы — АО «Темиртас Жол Сервис».
    - >-
      Залогодатель {PERSON} (ИИН {IIN}) передаёт в залог автомобиль 2019 года выпуска,
      оценочная стоимость {amount} тенге.
    - >-
      Уведомляем {PERSON:acc}, что заявка на автокредит одобрена. Договор можно подписать
      в отделении на проспекте Абая, 44, при себе иметь удостоверение личности.
    - >-
      Досрочное погашение: с карты {CARD} списано {amount} тенге, кредит по договору {doc_no}
      закрыт. Справку об отсутствии задолженности направили на {EMAIL}.
    - >-
      Просим подтвердить занятость заёмщика. Работодатель: ТОО «Жулдыз Строй Инвест»,
      БИН {BIN}, контактное лицо в отделе кадров — {PERSON}, {PHONE}.
    - >-
      Выдача транша {amount} тенге на счёт {KZ_IBAN} согласована. Получатель —
      ТОО «Кокше Агро Трейд», БИН {BIN}.
    - >-
      По заявке № {order_no} не хватает данных о поручителе: {PERSON}, {IIN}, {PHONE}.
      Без согласия на проверку в кредитном бюро заявку дальше не двигаем.
    - >-
      Заявка на кредит для бизнеса от ИП {PERSON:gen}: оборот за год {amount} тенге,
      контактный телефон {PHONE}.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      {PERSON} просит пересчитать график платежей по кредиту. ИИН {IIN}, остаток долга
      {amount} тенге, договор {doc_no}.
    # Benchmark v1: a name in the case that the sentence asks for. The generator writes the name in
    # that case (bench/decline.py), so the sentence is grammatical around it.
    - >-
      Кредит {PERSON:dat} одобрен на сумму {amount} тенге. ИИН заёмщика: {IIN}, договор направлен на
      {EMAIL}.
    - >-
      По заявке {PERSON:gen} запрошена справка о доходах за шесть месяцев. Телефон для связи:
      {PHONE}.
    - >-
      Поручителем выступает родственник заёмщика. Договор поручительства подписан {PERSON:ins}, ИИН
      {IIN}.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} просит увеличить лимит по карте {CARD}. Доход подтверждён справкой, ИИН {IIN}.
    - >-
      {PERSON} подаёт заявку на рефинансирование. ИИН {IIN}, телефон {PHONE}.

  transfer:
    - >-
      Прошу перевести {amount} тенге на счёт {KZ_IBAN}, получатель {PERSON}, назначение
      платежа — возврат займа.
    - >-
      Перевод не дошёл: отправитель {PERSON}, карта {CARD}, сумма {amount} тенге, дата
      операции {date}. Клиент просит найти платёж.
    - >-
      Реквизиты для оплаты: ТОО «Шанырак Комплект», БИН {BIN}, ИИК {KZ_IBAN}, КБе 17.
      Счёт на оплату № {order_no} от {date}.
    - >-
      Клиент {PERSON} просит отменить автоплатёж с карты {CARD}: деньги списываются дважды
      в месяц, последний раз — {amount} тенге.
    - >-
      Зачисление зарплаты: {PERSON}, ИИН {IIN}, счёт {KZ_IBAN}, к выплате {amount} тенге.
    - >-
      Международный перевод отклонён комплаенсом. Отправитель: {PERSON}, ИИН {IIN}.
      Причина: не предоставлен договор-основание.
    - >-
      Подтвердите, пожалуйста, перевод между своими счетами: с {KZ_IBAN} на {KZ_IBAN},
      сумма {amount} тенге.
    - >-
      Ошибочный платёж: бухгалтерия отправила {amount} тенге на счёт {KZ_IBAN} вместо счёта
      поставщика. Просим вернуть средства, письмо от {date} приложено.
    - >-
      Перевод по номеру телефона {PHONE} завис в статусе «в обработке». Сумма {amount} тенге,
      получатель в приложении отображается как {PERSON}.
    - >-
      Возврат по чеку № {order_no}: деньги вернутся на карту {CARD} в течение пяти рабочих
      дней. Уведомление отправили на {EMAIL}.
    - >-
      Платёжное поручение {doc_no}: плательщик АО «Сарыарка Энергосбыт Плюс», БИН {BIN};
      бенефициар {PERSON}, ИИН {IIN}, счёт {KZ_IBAN}.
    - >-
      Клиент сообщил о подозрительном списании {amount} тенге с карты {CARD}, операция
      от {date}. Карту заблокировали, перевыпуск оформлен.
    - >-
      Алименты удерживаются из зарплаты {PERSON:gen} и перечисляются на счёт {KZ_IBAN}
      до 10 числа каждого месяца.
    - >-
      Пополнение депозита через кассу: вноситель {PERSON}, {IIN}, сумма {amount} тенге,
      счёт депозита {KZ_IBAN}.
    - >-
      Операция {order_no} отклонена: превышен суточный лимит по карте {CARD}. Клиент {PERSON}
      просит временно поднять лимит до {amount} тенге.
    - |-
      Реестр выплат за {date}:
      1; {PERSON}; {IIN}; {KZ_IBAN}; {amount}
      2; {PERSON}; {IIN}; {KZ_IBAN}; {amount}
    - >-
      Оплата за аренду помещения: получатель — ИП {PERSON}, ИИН/БИН {IIN}, ИИК {KZ_IBAN},
      сумма {amount} тенге.
    # Benchmark v1: a name in the case that the sentence asks for. The generator writes the name in
    # that case (bench/decline.py), so the sentence is grammatical around it.
    - >-
      Перевод {PERSON:dat} на сумму {amount} тенге отклонён банком: проверьте счёт {KZ_IBAN}.
    - >-
      Деньги получены от {PERSON:gen} по номеру телефона {PHONE}, назначение платежа не указано.
    - >-
      Прошу вернуть ошибочный перевод: получателя {PERSON:acc} я не знаю, платёж ушёл на карту
      {CARD}.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      Перевод не дошёл. {PERSON} ждёт деньги на счёт {KZ_IBAN} с {date}.

  insurance:
    - >-
      Страховой случай № {order_no}: страхователь {PERSON}, ИИН {IIN}, ДТП от {date},
      заявленный ущерб {amount} тенге.
    - >-
      Выплата по полису ОГПО одобрена. Перечислить {amount} тенге на счёт {KZ_IBAN},
      получатель — {PERSON}.
    - >-
      Просим дослать документы по убытку: копию техпаспорта и заявление от {PERSON:gen}.
      Скан можно отправить на {EMAIL}.
    - >-
      Полис КАСКО {doc_no} оформлен на {PERSON:acc}, ИИН {IIN}. Страховая премия {amount}
      тенге оплачена картой {CARD}.
    - >-
      Выгодоприобретатель по договору страхования жизни — {PERSON}, {IIN}.
      Контактный телефон: {PHONE}.
    - >-
      Отказ в выплате: на момент ДТП автомобилем управляло лицо, не вписанное в полис, —
      {PERSON}. Уведомление направлено заказным письмом {date}.
    - >-
      Эксперт осмотрит автомобиль завтра. Связаться с владельцем: {PERSON}, {PHONE}.
      Адрес осмотра — улица Сатпаева, 90.
    - >-
      Корпоративный договор медицинского страхования: страхователь ТОО «Данекер Фарм Импорт»,
      БИН {BIN}, 124 застрахованных сотрудника, премия {amount} тенге.
    - >-
      Регрессное требование на {amount} тенге предъявлено виновнику аварии: {PERSON},
      ИИН {IIN}.
    - >-
      Клиент просит расторгнуть договор страхования и вернуть часть премии на карту {CARD}.
      Заявление принято {date}, срок рассмотрения — 10 рабочих дней.
    - >-
      Страховой агент {PERSON} (тел. {PHONE}) продлевает полис ОГПО клиента на год.
      ИИН страхователя: {IIN}.
    - >-
      По убытку № {order_no} назначена дополнительная экспертиза. Просим {PERSON:acc}
      предоставить автомобиль на СТО до пятницы.
    - >-
      Залив квартиры: страхователь {PERSON}, {PHONE}, {EMAIL}. Ущерб отделке оценён
      в {amount} тенге, акт управляющей компании приложен.
    - >-
      Страховая выплата по несчастному случаю: {amount} тенге, получатель {PERSON},
      ИИН {IIN}, счёт {KZ_IBAN}.
    - >-
      Перестраховщик запросил бордеро за третий квартал. Ответственный со стороны
      страховщика — {PERSON}, {EMAIL}.
    - >-
      Сообщаем, что срок действия полиса {doc_no} истекает {date}. Для продления позвоните
      менеджеру по номеру {PHONE} или напишите на {EMAIL}.
    - >-
      Страхователь — ИП {PERSON}, ИИН {IIN}: товар на складе застрахован на {amount} тенге,
      полис {doc_no}.
    # Benchmark v1: a name in the case that the sentence asks for. The generator writes the name in
    # that case (bench/decline.py), so the sentence is grammatical around it.
    - >-
      Страховая выплата назначена {PERSON:dat}, ИИН {IIN}. Сумма {amount} тенге поступит на счёт
      {KZ_IBAN}.
    - >-
      Убыток урегулирован: с {PERSON:ins} подписано соглашение, копия отправлена на {EMAIL}.
    - >-
      В заявлении {PERSON:gen} указан другой номер полиса. Перезвоните по телефону {PHONE}.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} сообщает о страховом случае: залита квартира, ущерб оценён в {amount} тенге. Телефон:
      {PHONE}.

  hr:
    - >-
      Приказ № {doc_no}: принять {PERSON:acc} на должность ведущего специалиста отдела рисков
      с {date}, оклад {amount} тенге.
    - >-
      Уважаемые коллеги! С понедельника к нам выходит новый аналитик — {PERSON}.
      Рабочая почта: {EMAIL}, внутренний номер 2417.
    - >-
      Для оформления пропуска пришлите, пожалуйста, данные сотрудника: {PERSON}, ИИН {IIN},
      мобильный {PHONE}.
    - >-
      Заявление на отпуск: {PERSON} просит предоставить ежегодный трудовой отпуск с {date}
      на 14 календарных дней.
    - >-
      Справка дана {PERSON:dat}, ИИН {IIN}, в подтверждение работы в компании с {date}
      в должности главного бухгалтера.
    - >-
      Зарплатный проект: сотрудник {PERSON}, счёт для перечисления заработной платы
      {KZ_IBAN}, карта {CARD}.
    - >-
      Трудовой договор с {PERSON:ins} расторгается по соглашению сторон. Компенсация
      за неиспользованный отпуск — {amount} тенге.
    - >-
      Командировка в Атырау: {PERSON}, с {date} по {date}. Суточные перечислить
      на карту {CARD}.
    - >-
      Кандидат на вакансию «системный администратор»: {PERSON}, {PHONE}, {EMAIL}.
      Собеседование назначено на четверг, 15:00.
    - >-
      Просим предоставить в бухгалтерию копию удостоверения личности нового сотрудника.
      Пока есть только: {PERSON}, {IIN}.
    - >-
      Объявить выговор {PERSON:dat} за нарушение трудовой дисциплины. Основание: служебная
      записка руководителя отдела от {date}.
    - >-
      Больничный лист: {PERSON} отсутствует с {date}. Контакт для срочных вопросов — {PHONE},
      задачи временно передаются {PERSON:dat}.
    - >-
      Перевести {PERSON:acc} из филиала в Караганде в головной офис с сохранением оклада.
      Новый руководитель — {PERSON}.
    - >-
      Материальная помощь в размере {amount} тенге назначена {PERSON:dat} в связи
      с рождением ребёнка. Перечислить на счёт {KZ_IBAN}.
    - |-
      Анкета сотрудника
      ФИО: {PERSON}
      ИИН: {IIN}
      Телефон: {PHONE}
      E-mail: {EMAIL}
      Банковский счёт: {KZ_IBAN}
    - >-
      Договор о полной материальной ответственности подписан с кассиром {PERSON:ins},
      ИИН {IIN}.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      {PERSON} выходит из отпуска в понедельник. Пропуск продлён до {date}, рабочая почта
      прежняя: {EMAIL}.

    - >-
      Протокол № {doc_no} заседания комиссии по трудовым спорам от {date}. Присутствовали:
      {PERSON:surname}, {PERSON:surname} и {PERSON:surname}. Председатель: {PERSON:surname}.
      Секретарь собрания: {PERSON}. {PERSON:surname} — докладчик по первому вопросу.
    - |-
      Состав аттестационной комиссии на {date}:
      - {PERSON:surname}
      - {PERSON:surname}
      - {PERSON:surname}
      Ответственный: {PERSON:surname}
      Фамилия секретаря: {PERSON:surname}
    # Benchmark v1: a name in the case that the sentence asks for. The generator writes the name in
    # that case (bench/decline.py), so the sentence is grammatical around it.
    - >-
      Прошу оформить отпуск {PERSON:dat} с {date}. Отпускные перечислить на счёт {KZ_IBAN}.
    - >-
      Характеристика на {PERSON#1:acc} готова. Акт о приёме дел составлен при {PERSON#1:prep}, копию
      отправили на {EMAIL}.
    - >-
      Трудовой договор с {PERSON:ins} расторгнут {date}. Расчёт направлен на карту {CARD}.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} выходит на работу с {date}. Пропуск и доступ к почте {EMAIL} оформить до пятницы.
  contract:
    - >-
      ТОО «Берекет Инжиниринг Сервис», БИН {BIN}, в лице директора {PERSON:gen}, действующего
      на основании Устава, именуемое в дальнейшем «Исполнитель».
    - >-
      Реквизиты сторон. Заказчик: АО «Каспий Ойл Снаб», БИН {BIN}, ИИК {KZ_IBAN}.
      Исполнитель: индивидуальный предприниматель, ИИН {IIN}.
    - >-
      Договор аренды № {doc_no} от {date}. Арендодатель: {PERSON}, ИИН {IIN}.
      Арендная плата — {amount} тенге в месяц.
    - >-
      Оплата по настоящему Договору производится на расчётный счёт Поставщика {KZ_IBAN}
      в течение пяти банковских дней с даты подписания акта.
    - >-
      Акт выполненных работ № {order_no} подписан: со стороны Заказчика — {PERSON},
      со стороны Подрядчика — {PERSON}.
    - >-
      Дополнительное соглашение к договору {doc_no}: изменить банковские реквизиты
      Исполнителя на следующие — ИИК {KZ_IBAN}, БИН {BIN}.
    - >-
      Уведомления по договору направляются на электронный адрес {EMAIL}
      и по телефону {PHONE}.
    - >-
      Доверенность выдана {PERSON:dat}, ИИН {IIN}, на представление интересов
      ТОО «Мерей Транс Карго» в органах государственных доходов.
    - >-
      Договор займа между физическими лицами: займодавец {PERSON}, ИИН {IIN};
      заёмщик {PERSON}, ИИН {IIN}; сумма займа {amount} тенге.
    - >-
      Поставщик обязуется поставить оборудование до {date}. Контактное лицо Поставщика:
      {PERSON}, тел. {PHONE}, {EMAIL}.
    - >-
      Счёт-фактура № {order_no} от {date}. Поставщик: ТОО «Зерек Софт Лаб», БИН {BIN}.
      Получатель: ТОО «Орда Ритейл Систем», БИН {BIN}. Сумма с НДС {amount} тенге.
    - >-
      Гарантийное письмо: обязуемся оплатить задолженность {amount} тенге до {date}.
      Директор {PERSON}.
    - >-
      Договор оказания услуг заключён с самозанятым исполнителем: {PERSON}, {IIN}.
      Вознаграждение перечисляется на карту {CARD}.
    - >-
      Претензия по договору поставки {doc_no}: товар не поставлен, предоплата {amount} тенге
      не возвращена. Ответ просим направить на {EMAIL}.
    - >-
      Подписант со стороны банка — {PERSON}, доверенность № {doc_no}. Подписант со стороны
      клиента — {PERSON}, ИИН {IIN}.
    - >-
      Стороны договорились о расторжении договора с {date}. Обеспечительный платёж {amount}
      тенге возвращается на счёт {KZ_IBAN}.
    - >-
      Договор поставки заключён с ИП {PERSON:ins}, ИИН {IIN}. Оплата — на счёт {KZ_IBAN}
      в течение трёх банковских дней.
    # Benchmark v1: a name in the case that the sentence asks for. The generator writes the name in
    # that case (bench/decline.py), so the sentence is grammatical around it.
    - >-
      Договор аренды заключён между {PERSON:ins} и ТОО «Сарыарқа Трейд Групп», БИН {BIN}.
    - >-
      Доверенность выдана {PERSON:dat}, ИИН {IIN}, на подписание актов до {date}.
    - >-
      Счёт выставлен на имя {PERSON:gen}. Оплату ждём на {KZ_IBAN}, вопросы — по телефону {PHONE}.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      Договор готов к подписанию. {PERSON} и {PERSON} подписывают его в четверг, реквизиты для
      оплаты: {KZ_IBAN}.

  call_centre:
    - >-
      Звонок от {date}. Клиент {PERSON} жалуется на двойное списание, просит перезвонить
      на {PHONE} после 18:00.
    - >-
      Клиент не может войти в приложение, СМС с кодом не приходит. Номер в анкете: {PHONE},
      ИИН {IIN}.
    - >-
      Обращение № {order_no}: клиент просит разблокировать карту {CARD}. Личность подтверждена
      по кодовому слову.
    - >-
      Перезвонить: {PHONE}. Вопрос по досрочному погашению, клиент — {PERSON}.
    - >-
      Клиент продиктовал ИИН {IIN} и попросил выслать график платежей на {EMAIL}.
    - >-
      Жалоба на навязчивые звонки: абонент {PHONE} просит исключить номер из обзвона.
      Заявка передана в отдел качества.
    - >-
      Оператор {PERSON}: клиент интересуется ставкой по депозиту, обещает подойти
      в отделение на улице Гоголя, 15.
    - >-
      Клиент просит сменить номер телефона в профиле: старый {PHONE}, новый {PHONE}.
      Для подтверждения нужен визит в отделение с удостоверением.
    - >-
      Входящий звонок, тема — потерянная карта. Карта {CARD} заблокирована по просьбе
      владельца. Владелец — {PERSON}.
    - >-
      Клиент {PERSON} (ИИН {IIN}) оспаривает комиссию {amount} тенге за перевод.
      Создано обращение, срок ответа — три рабочих дня.
    - >-
      Не дозвонились: {PHONE}, {PHONE}. Клиент — {PERSON}, просрочка 12 дней, повторить
      звонок завтра в первой половине дня.
    - >-
      Абонент спрашивает, почему не пришёл перевод на счёт {KZ_IBAN}. Отправитель —
      ТОО «Тумар Маркет Плюс», платёж от {date}.
    - >-
      Запрос от юрлица: бухгалтер {PERSON} уточняет остаток по счёту компании, БИН {BIN}.
      Сообщили, что для этого нужны права доступа.
    - >-
      Данные карты продиктованы оператору: {CARD} 09/27. Клиенту напомнили, что срок
      действия и CVV называть нельзя.
    - >-
      Клиент {PERSON} хочет получать выписки на почту {EMAIL}, а не на бумаге.
      Согласие записано, изменения внесены.
    - >-
      Звонок сорвался. Известно только: {PERSON}, {PHONE}, вопрос по страховке к кредиту.
    - >-
      Звонок от предпринимателя: ИП {PERSON} не может подключить эквайринг, просит
      перезвонить на {PHONE}.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      Обращение принято в 10:40. {PERSON} просит перезвонить после обеда по номеру {PHONE}:
      не проходит оплата картой {CARD}.
    # Benchmark v1: a name in the case that the sentence asks for. The generator writes the name in
    # that case (bench/decline.py), so the sentence is grammatical around it.
    - >-
      Передайте {PERSON:dat}, что карта {CARD} разблокирована. Клиент ждёт звонка по номеру {PHONE}.
    - >-
      Жалоба от {PERSON:gen} зарегистрирована. Ответ направим на {EMAIL} в течение трёх дней.
    # Benchmark v1: a name that opens the text or a sentence, where a capital letter says nothing.
    # Given name first or surname first, as the generator draws it.
    - >-
      {PERSON} звонит третий раз за день: не приходит код подтверждения на номер {PHONE}.

  it_incident:
    - >-
      Инцидент INC-{order_no}: в публичный репозиторий попал токен GitLab
      {SECRET:gitlab_token}. Токен отозван, пайплайны перезапущены с новым.
    - >-
      В логах платёжного сервиса в открытом виде пишется заголовок
      Authorization: Bearer {SECRET:bearer_token}. Нужно замаскировать вывод и перевыпустить
      токен.
    - >-
      Дежурный инженер {PERSON} сообщает: в конфиге staging лежит строка подключения
      {SECRET:connection_string}. Пароль сменили, доступ к репозиторию ограничили.
    - >-
      Подрядчик выложил в общий чат ключи AWS: AWS_ACCESS_KEY_ID={SECRET:aws_access_key_id}
      и AWS_SECRET_ACCESS_KEY={SECRET:aws_secret_access_key}. Ключи деактивированы, ротация
      завершена.
    - >-
      Пользователь прислал в заявку пароль от VPN — пароль: {SECRET:password}. Учётную запись
      сбросили, сотруднику напомнили правила.
    - |-
      На тестовом сервере в домашнем каталоге лежал приватный ключ:
      {SECRET:private_key}
      Ключ удалён, сертификат перевыпущен.
    - >-
      В ветку feature/chat-bot закоммитили файл .env со строкой
      OPENAI_API_KEY={SECRET:openai_api_key}. Коммит {git_sha} удалён из истории, ключ отозван.
    - >-
      Клиентское приложение присылает JWT со сроком жизни 30 дней: {SECRET:jwt}.
      Это нарушение политики, срок нужно сократить до 15 минут.
    - >-
      Токен бота {SECRET:slack_token} попал на скриншот в общем канале. Перевыпустили,
      скриншот удалили, автора предупредили.
    - >-
      Ключ Google Maps {SECRET:google_api_key} зашит в мобильное приложение без ограничений
      по пакету. Завели задачу на ограничение и ротацию.
    - >-
      Утечка персональных данных в логах: сервис скоринга пишет ИИН клиентов, пример —
      {IIN}. Ответственный за исправление — {PERSON}, {EMAIL}.
    - >-
      В скрипте деплоя найдено: git clone
      https://{SECRET:github_token}@git.example.com/core/billing.git. Токен привязан
      к сервисной учётке, отозван.
    - >-
      Мониторинг: сервис auth вернул 500, метка времени события {timestamp_ms}.
      В трассировке виден ключ {SECRET}, обращение {uuid}. Причина — отладочный лог на проде.
    - >-
      Сотрудник переслал себе на личную почту {EMAIL} выгрузку с ИИН и телефонами клиентов.
      Пример строки: {IIN}; {PHONE}. Расследование ведёт служба ИБ.
    - >-
      В логе шлюза запись: iin={IIN} req={number_12} status=409. ИИН в логах нужно
      маскировать, задача заведена на команду платформы.
    # A name that opens a sentence, with no word for a person next to it: where a capital
    # letter says nothing, and a surname without an ending says nothing either.
    - >-
      {PERSON} с утра не может войти в систему: учётная запись {EMAIL} заблокирована
      после трёх неверных попыток. Заявка № {order_no}.
