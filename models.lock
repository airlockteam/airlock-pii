# Model files of the ner-ru extra of airlock-pii: slovnet's Russian NER model and the navec
# embeddings it was trained with (natasha project, MIT).
#
# - `make models` (python -m airlock_pii models download --dir models) fetches them.
# - The SHA-256 of a file is checked after a download and again before every load.
# - The sources of a file are tried in the order given. The second one is the same bytes
#   inside the natasha wheel on PyPI: the wheel is read as an archive and never installed.
#
# packages/airlock-pii/src/airlock_pii/data/models.lock is a copy of this file, because the
# wheel has to carry the hashes. A test keeps the two identical.

